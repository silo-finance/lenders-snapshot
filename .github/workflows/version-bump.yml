name: Version bump

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

jobs:
  bump:
    name: Sync package version with release branch
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Fetch base branch
        run: git fetch origin "$BASE_REF" --depth=1
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Set version from branch name (fallback to patch bump)
        env:
          # Branch names are passed via env (never interpolated into the script body)
          # to avoid any shell/JS injection through the ref.
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const fs = require("node:fs");

          const headRef = process.env.HEAD_REF || "";
          const baseRef = `origin/${process.env.BASE_REF}`;
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));

          // Primary mode: a `release/X.Y.Z` or `hotfix/X.Y.Z` branch is the single source
          // of truth for the version. We set package.json to exactly that version so the
          // released package version always matches the branch (and the tag created from it).
          const branchMatch = /^(?:release|hotfix)\/(\d+\.\d+\.\d+)$/.exec(headRef);
          if (branchMatch) {
            const target = branchMatch[1];
            if (pkg.version === target) {
              console.log(`package.json already at branch version ${target}; nothing to do.`);
              process.exit(0);
            }
            console.log(`Setting package.json version ${pkg.version} -> ${target} (from branch ${headRef}).`);
            pkg.version = target;
            fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
            process.exit(0);
          }

          // Fallback mode (non release/hotfix PR to master): keep the historical behaviour of
          // auto-incrementing the patch when the version was not changed versus the base.
          let basePkg;
          try {
            basePkg = JSON.parse(execFileSync("git", ["show", `${baseRef}:package.json`], { encoding: "utf8" }));
          } catch {
            console.log("package.json does not exist on the base branch yet; skipping version bump.");
            process.exit(0);
          }

          if (pkg.version !== basePkg.version) {
            console.log(`package.json version already changed: ${basePkg.version} -> ${pkg.version}`);
            process.exit(0);
          }

          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(pkg.version);
          if (!match) {
            throw new Error(`Unsupported package version: ${pkg.version}`);
          }

          const [, major, minor, patch] = match;
          pkg.version = `${major}.${minor}.${Number(patch) + 1}`;
          fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          console.log(`Bumped package.json to ${pkg.version}`);
          NODE

      - name: Sync package-lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit version change
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No version changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Sync package version with release branch"
          git push
