name: Snapshot scan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    name: Build lender snapshot release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/lender-snapshot/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/lender-snapshot/requirements.txt

      - name: Run snapshot
        run: python scripts/lender-snapshot/snapshot_lenders.py
        env:
          SONIC_RPC_URL: ${{ secrets.SONIC_RPC_URL }}
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
          THE_GRAPH_API_KEY: ${{ secrets.THE_GRAPH_API_KEY }}

      - name: QA snapshot
        run: python scripts/lender-snapshot/qa_check.py

      - name: Create release with snapshot JSON
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: snapshot-${{ github.run_number }}
        run: |
          gh release create "$TAG" \
            scripts/lender-snapshot/distribution_snapshot.json \
            --title "Lender snapshot $TAG" \
            --notes "Automated lender snapshot generated by workflow run ${{ github.run_id }}."
