name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter (fails on errors and warnings)
        run: npm run lint

      - name: Build static site
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Force Pages source to GitHub Actions
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const current = await github.request("GET /repos/{owner}/{repo}/pages", {
              owner,
              repo,
            });
            const before = current.data.build_type ?? "null";
            core.info(`Current Pages build_type: ${before}`);

            if (before !== "workflow") {
              await github.request("PUT /repos/{owner}/{repo}/pages", {
                owner,
                repo,
                build_type: "workflow",
              });
              core.info("Requested Pages build_type update to workflow.");
            }

            const afterCheck = await github.request("GET /repos/{owner}/{repo}/pages", {
              owner,
              repo,
            });
            const after = afterCheck.data.build_type ?? "null";
            core.info(`Pages build_type after update attempt: ${after}`);

            if (after !== "workflow") {
              core.setFailed(
                `Pages build_type is still '${after}'. Switch Settings > Pages > Build and deployment > Source to 'GitHub Actions'.`
              );
            }

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
